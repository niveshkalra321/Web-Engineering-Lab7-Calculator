<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator with Sub Menu - Lab 07</title>
    <link rel="stylesheet" href="Nivesh_Kumar_515533.css">
</head>

<!-- Nivesh Kumar CMS ID: 515533 -->

<body>

    <div class="calculator-container">
        <!-- Top-Right Three-Dots Navigation Menu -->
        <div class="menu-container">
            <div class="three-dots" id="menuBtn">&#8942;</div>
            <div class="sub-menu" id="subMenu">
                <button onclick="switchMode('standard')">Standard Mode</button>
                <button onclick="switchMode('scientific')">Scientific Mode</button>
                <button onclick="switchMode('unit')">Unit Conversion</button>
                <button onclick="switchMode('currency')">Currency Conversion</button>
            </div>
        </div>

        <!-- Calculator Screen -->
        <input type="text" id="calcScreen" readonly value="0">

        <!-- 1. Standard Calculator Keypad -->
        <div class="keypad" id="standardKeypad">
            <button onclick="clearScreen()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="appendValue('/')">/</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">*</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculateResult()" class="equal">=</button>
        </div>

        <!-- 2. Scientific Mode Panel -->
        <div class="mode-panel" id="scientificPanel" style="display: none;">
            <h3>Scientific Mode</h3>
            <div class="keypad">
                <button onclick="sciCalc('sqrt')">√x</button>
                <button onclick="sciCalc('sqr')">x²</button>
                <button onclick="sciCalc('sin')">sin</button>
                <button onclick="sciCalc('cos')">cos</button>
                <button onclick="sciCalc('tan')">tan</button>
                <button onclick="clearScreen()">C</button>
            </div>
        </div>

        <!-- 3. Unit Conversion Panel -->
        <div class="mode-panel" id="unitPanel" style="display: none;">
            <h3>Unit Conversion (Length)</h3>
            <input type="number" id="unitInput" placeholder="Enter Meters"
                style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <button onclick="convertUnits()"
                style="width:100%; padding:10px; background:#ff9800; color:white; border:none; border-radius:4px; cursor:pointer;">Convert
                to Feet</button>
            <p id="unitResult" style="margin-top:10px; font-size:16px;"></p>
        </div>

        <!-- 4. Currency Conversion Panel -->
        <div class="mode-panel" id="currencyPanel" style="display: none;">
            <h3>Currency Conversion</h3>
            <input type="number" id="currInput" placeholder="Enter USD ($)"
                style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <button onclick="convertCurrency()"
                style="width:100%; padding:10px; background:#ff9800; color:white; border:none; border-radius:4px; cursor:pointer;">Convert
                to PKR</button>
            <p id="currResult" style="margin-top:10px; font-size:16px;"></p>
        </div>
    </div>

    <script src="Nivesh_Kumar_515533.js"></script>
</body>

</html>
